name: CI

# Minutes matter: the repo is private, so every run counts against the owner's
# monthly quota, and CI stopped for hours on 3 Mehr 1405 over a billing problem
# on that account. What this file does to keep usage down, with numbers, is in
# docs/phase2/DEPLOY.md (C3).

on:
  pull_request:
    # A PR that only changes Markdown or deploy/ (separate images) can't break the app.
    paths-ignore: ["**/*.md", "docs/**", "deploy/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "deploy/**"]
  # Manual run, e.g. on main after an outage (docs/phase2/DEPLOY.md, 7.5).
  workflow_dispatch:

# A new push to the same PR (or to main) cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # One job instead of two: GitHub bills every job rounded UP to a whole
    # minute, and the setup (checkout, npm ci, database) was paid twice.
    # Pinned to 24.04 because its preinstalled PostgreSQL is 16, the version
    # production runs.
    runs-on: ubuntu-24.04
    # A normal run takes about 2 minutes. Without this a hung test could bill
    # up to 6 hours.
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ghaltak_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ghaltak_test?schema=public
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ghaltak_e2e?schema=public
      SESSION_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4

      # The runner's own PostgreSQL starts in about 2 seconds; a service
      # container took 15-20 to pull and pass its health check.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb ghaltak_test
          sudo -u postgres createdb ghaltak_e2e

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:deploy
      - run: npm test
      - run: npm run build

      # End-to-end tests in a real browser (e2e/). They use the runner's
      # preinstalled Google Chrome instead of downloading Chromium and its
      # system libraries on every run (about 25 seconds).
      - name: npm run test:e2e
        run: npm run test:e2e
        env:
          E2E_BROWSER_CHANNEL: chrome

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
